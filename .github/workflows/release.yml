name: Release

# Pushing a tag vX.Y.Z publishes a GitHub release with Ledly-win-x64.zip, Ledly-win-arm64.zip and
# their .sha256. Installed copies pick it up through the updater; install.ps1 downloads the latest.
#   git tag v1.1.0 && git push origin v1.1.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          ./build.ps1 -Version $version -Runtime win-x64,win-arm64

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            build/Ledly-win-x64.zip build/Ledly-win-x64.zip.sha256 `
            build/Ledly-win-arm64.zip build/Ledly-win-arm64.zip.sha256 `
            --title "Ledly ${{ github.ref_name }}" --generate-notes
